name: Terraform AWS Deployment
on:
  pull_request:
    branches:
      - main
    paths:
      - "prometheous_grafana_Setup/**"
      - ".github/workflows/terraform-aws.yml"
  push:
    branches:
      - main
    paths:
      - "prometheous_grafana_Setup/**"
      - ".github/workflows/terraform-aws.yml"

permissions:
  contents: read
concurrency:
  group: prometheus-grafana-terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Must be the same role that trust-policy.json / oidc-role.tf create.
  AWS_ROLE_ARN: arn:aws:iam::490164024161:role/GitHubActions-Terraform-Role

jobs:
  # JOB 1: Validate Terraform on Pull Requests (no AWS credentials needed)
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: ./prometheous_grafana_Setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # JOB 2: Deploy Infrastructure to AWS
  terraform-deploy:
    name: Terraform AWS Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # With this set, the OIDC token's sub claim becomes:
    # repo:sujatrodas96/Terraform-Project:environment:production
    environment: production

    permissions:
      id-token: write # required for OIDC
      contents: read

    defaults:
      run:
        working-directory: ./prometheous_grafana_Setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Authentication
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
